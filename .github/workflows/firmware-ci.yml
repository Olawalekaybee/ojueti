# Build the firmware on every push and pull request.
# Pushing a tag such as v0.1.0 also publishes a GitHub Release with flashable binaries,
# so each episode of the series has a matching release anyone can download.
name: firmware-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build firmware (ESP-IDF v5.5, esp32p4)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the firmware version comes from git describe

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32p4
          path: "firmware"

      - name: Collect firmware files
        run: |
          mkdir -p dist
          sudo cp firmware/build/ojueti.bin \
                  firmware/build/bootloader/bootloader.bin \
                  firmware/build/partition_table/partition-table.bin \
                  firmware/build/flasher_args.json \
                  dist/
          sudo chown -R "$USER" dist
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojueti-firmware-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
